name: forecast

# Every 6 hours: fetch models -> compute -> publish static JSON to GitHub Pages.
# The page at tokenfly.ai/snow/ reads https://tokenflyai.github.io/snow/data/v1/.
# If anything fails nothing is deployed, so the previous data stays online.

on:
  schedule:
    # ~2.5 h after the 00/06/12/18 UTC model cycles, off the top of the hour
    - cron: "37 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write     # weekly heartbeat commit (keeps scheduled runs enabled)
  pages: write
  id-token: write
  issues: write       # failure alert

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Run pipeline
        run: python -m pipeline.run --out site/data/v1 --archive archive
      - name: Add landing page
        run: |
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Snow forecast data</title>
          <meta http-equiv="refresh" content="0; url=https://tokenfly.ai/snow/">
          <p>Forecast data for <a href="https://tokenfly.ai/snow/">tokenfly.ai/snow</a>.
          See <a href="data/v1/manifest.json">data/v1/manifest.json</a>.</p>
          HTML
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # The deploy right after the upload occasionally fails on GitHub's side ("No artifacts named
      # github-pages were found", 2026-11-15 19:56); one retry after a pause.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # Every issued forecast is kept on the orphan branch "archive" so it can be scored against
      # observations later (pipeline/verify/archive.py). Only after a successful deploy, and a
      # failure here never fails the run.
      - name: Archive the issued forecasts
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/push_archive.sh archive "archive: run ${{ github.run_id }} ($(date -u +%Y-%m-%dT%H:%MZ))"

      # GitHub disables scheduled workflows after 60 days without repository activity. Keyed on the
      # age of the last commit on main, not on one cron slot: scheduled runs are often skipped.
      - name: Weekly heartbeat commit
        if: github.event_name == 'schedule'
        run: |
          if [ $(( $(date -u +%s) - $(git log -1 --format=%ct) )) -gt $(( 7 * 86400 )) ]; then
            mkdir -p status
            cp site/data/v1/manifest.json status/last_run.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add status/last_run.json
            git commit -m "chore: weekly pipeline heartbeat" || true
            git push || true
          fi

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Forecast pipeline failed"
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}  — the previous data is still being served."
          n=$(gh issue list --repo "${{ github.repository }}" --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "${{ github.repository }}" --body "$body"
          else gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"; fi
