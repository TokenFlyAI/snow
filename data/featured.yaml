# Featured resorts: refreshed on every run (every 6 hours) with every model that
# covers them, plus all four ensembles once a day. Everything else in
# data/resorts.yaml is "standard": once a day, ECMWF IFS + GFS + one regional
# model, and the GEFS ensemble.
#
# The list is limited by the Open-Meteo free tier (10,000 weighted calls a day;
# we stay under 8,000). A featured resort in the US costs about 115 calls a day,
# a standard one about 16. tests/test_budget.py fails if this list no longer fits.
featured:
  # California
  - palisades-tahoe
  - mammoth
  - kirkwood
  - heavenly
  - northstar
  # Utah
  - alta
  - snowbird
  - park-city
  # Colorado
  - vail
  - breckenridge
  - snowmass
  - steamboat
  - winter-park
  - telluride
  # Northern Rockies
  - jackson-hole
  - big-sky
  # Pacific Northwest
  - stevens-pass
  - crystal-mountain
  - mt-bachelor
  # Canada
  - whistler-blackcomb
  - revelstoke
  # East
  - killington
  # Japan
  - niseko-hirafu
  - happo-one
  # Europe: the only resorts that use the European regional models (AROME, ICON-CH)
  - zermatt
  - chamonix-grands-montets
  - val-thorens
  - st-anton
