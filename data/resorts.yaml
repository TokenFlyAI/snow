# Resort database. One entry per forecast point.
# - lat/lon: centre of the main ski terrain (OSM landuse=winter_sports centroid), NOT the base town.
# - elevation_m: base / mid / summit of lift-served terrain, in metres.
# - passes: ikon / epic -> unlimited | 7day | 5day | 2day
# - snotel: NRCS station triplet used for verification (US only); null if none within range.
# - needs_review: true when a value could not be confirmed from two sources.
