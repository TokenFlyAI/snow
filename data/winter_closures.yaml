# Mountain roads that are closed all winter (roughly Nov - May), hand-maintained.
# scripts/build_drive_table.py checks every route for a point within radius_km of a closure;
# such a route is replaced by the shortest route through one of the detour points (a town or an
# open pass on the winter route) that avoids every closure. Coordinates: the pass summit.
# Passes that are kept open (Donner, Echo, Carson, Teton, Monarch, Julier, Maloja, Brenner, the
# Dolomite passes, Envalira, ...) are not listed.
